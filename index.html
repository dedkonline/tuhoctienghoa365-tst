k;height:100%;background:#f1d58b;width:0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.tile{cursor:pointer;transition:.18s}.tile:hover{transform:translateY(-3px);border-color:#a9cbb9}.tile .emoji{font-size:27px}.tile h3{margin:9px 0 4px}.tile p,.muted{color:var(--muted)}h2{font-size:25px;margin:28px 0 12px}h3{margin-top:0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:28px 0 12px}.sectionhead h2{margin:0}.input{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 12px;min-width:0;color:var(--ink)}.lessonlist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.lessonrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:white;padding:13px;border-radius:14px;cursor:pointer;text-align:left;color:var(--ink)}.lessonrow:hover{border-color:var(--green)}.num{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--green2);color:var(--green);display:grid;place-items:center;font-weight:800}.lessonrow.done .num{background:var(--green);color:white}.lessonrow .desc{min-width:0;flex:1}.lessonrow strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lessonrow small{color:var(--muted)}.tag{font-size:11px;padding:4px 8px;background:#f0f3f0;border-radius:99px;color:#586a64}.tag.done{background:var(--green2);color:var(--green)}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.lessonbody{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;line-height:1.7}.lessonbody h3{font-size:21px}.lessonbody h4{margin:18px 0 6px;color:var(--green)}.lessonbody p{margin:8px 0}.lessonbody table{border-collapse:collapse;width:100%;font-size:13px}.lessonbody td,.lessonbody th{border:1px solid var(--line);padding:8px;vertical-align:top}.lessonbody th{background:#edf5f0}.topicgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.topic{padding:17px;background:white;border:1px solid var(--line);border-radius:15px;cursor:pointer;text-align:left}.topic:hover{border-color:var(--green)}.topic strong{display:block}.topic small{color:var(--muted)}.practicegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.resource{padding:15px;border:1px solid var(--line);border-radius:14px;background:white;margin:10px 0}.resource a{color:var(--green);font-weight:700}.resource p{margin:4px 0;color:var(--muted);font-size:13px}.hide{display:none!important}.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}.live-box{background:var(--green2);border:2px dashed var(--green);border-radius:16px;padding:16px;margin:14px 0;text-align:center}.live-status{font-weight:700;color:var(--green);margin-bottom:8px;font-size:14px}.live-dot{display:inline-block;width:10px;height:10px;background:var(--red);border-radius:50%;margin-right:6px}.live-dot.active{background:var(--green);animation:spin 1.5s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:23px}.grid3{grid-template-columns:1fr}.lessonlist{grid-template-columns:1fr}.topicgrid{grid-template-columns:1fr 1fr}.practicegrid{grid-template-columns:1fr}.wrap{padding:18px 14px 70px}.topin{padding:10px 14px}.brand small{display:none}.hero-stat{padding:14px}}

<body>
<header class="top"><div class="topin"><div class="brand" onclick="go('home')"><div class="logo">華</div><div><strong>Tự học tiếng Hoa 365</strong><small>普通话 · Gia sư AI đồng hành</small></div></div><div class="topright"><span class="pill" id="networkPill">Online</span><span class="pill" id="progressPill">0/365 buổi</span></div></div></header>
<main class="wrap" id="app"><div class="card">Đang khởi tạo bài học...</div></main>
<div class="footer">Học theo nhịp của mình · Tiến độ lưu cục bộ trên thiết bị</div>

<script>
const RENDER_PROXY_WSS_URL = "wss://gemini-live-proxy-69dr.onrender.com";
let geminiLiveWs = null, liveAudioCtx = null, liveScriptProc = null, isLiveActive = false;

const $=s=>document.querySelector(s);
let route='home', activeDay=1, activeWeek=1;
const KEY='zh365_progress_v2';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{completed:[],scores:{},lastDay:1};

const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));$('#progressPill').textContent=state.completed.length+'/365 buổi'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Dữ liệu bài học cơ bản tích hợp sẵn trong code
const DEFAULT_LESSONS = Array.from({length: 365}, (_, i) => {
  let day = i + 1;
  return {
    day: day,
    week: Math.ceil(day / 7),
    weekTitle: "Giai đoạn " + Math.ceil(day / 30),
    title: day <= 7 ? ["Bốn thanh điệu + Số đếm 0-10", "Phụ âm b/p, d/t, g/k", "Phụ âm zh ch sh r, j q x", "Vận mẫu và biến thanh", "Ôn tập phát âm", "Chào hỏi cơ bản", "Đàm thoại chào hỏi"][day-1] : "Bài học Ngày " + day,
    html: `<p>Nội dung học tập cho Ngày ${day}. Hãy luyện phát âm từ vựng và nhấn nút bên dưới để thực hành nói chuyện trực tiếp với Gemini Live!</p>`
  };
});

let DB = {
  lessons: DEFAULT_LESSONS,
  topics: [
    { week: 1, title: "Phát âm & Thanh điệu" },
    { week: 2, title: "Chào hỏi cơ bản" },
    { week: 3, title: "Giới thiệu bản thân" },
    { week: 4, title: "Gia đình & Bạn bè" },
    { week: 5, title: "Mua sắm & Giá cả" },
    { week: 6, title: "Ăn uống & Gọi món" }
  ]
};

async function init(){
  try {
    let r = await fetch('assets/curriculum.json');
    if(r.ok) {
      let data = await r.json();
      if(data && data.lessons) DB = data;
    }
  } catch(e) {
    console.log("Dùng dữ liệu tích hợp sẵn.");
  }
  save();
  go('home');
}

function go(r,p={}){route=r;if(p.day)activeDay=p.day;if(p.week)activeWeek=p.week;render()}
function render(){({home:home,curriculum:curriculum,lesson:lesson,topics:topics,topicdetail:topicdetail,practice:practice,chat:chat,exam:exam}[route]||home)()}

function home(){
  let n=state.completed.length;
  $('#app').innerHTML=`
  <section class="hero">
    <div>
      <div class="pill" style="background:#ffffff20;color:#f5df9f">LỘ TRÌNH LINH HOẠT</div>
      <h1>Học tiếng Hoa<br>theo nhịp của anh.</h1>
      <p>Không cần học đúng ngày, không mất tiến độ khi nghỉ. Chọn bài muốn học, học lại hoặc học vượt bất cứ lúc nào.</p>
      <div class="row">
        <button class="btn" onclick="go('lesson',{day:${state.lastDay||1}})">Tiếp tục học · Ngày ${state.lastDay||1}</button>
        <button class="btn secondary" onclick="go('curriculum')">Chọn ngày học</button>
      </div>
    </div>
    <div class="hero-stat">
      <span>Tiến độ hoàn thành</span>
      <strong>${n}<small style="font-size:18px;font-weight:500"> / 365</small></strong>
      <div class="progress"><span style="width:${n/365*100}%"></span></div>
      <small>${n?`Đã hoàn thành ${n} buổi học.`:'Bắt đầu từ Ngày 1/365 khi sẵn sàng.'}</small>
    </div>
  </section>
  <div class="grid3">
    <div class="tile" onclick="go('curriculum')"><div class="emoji">📚</div><h3>Học theo giáo trình 365</h3><p>Chọn ngày, học lại, học vượt; bài học có từ vựng và ngữ pháp.</p></div>
    <div class="tile" onclick="go('topics')"><div class="emoji">🧭</div><h3>Học nhanh theo chủ đề</h3><p>Đi thẳng tới nhóm bài theo tình huống giao tiếp.</p></div>
    <div class="tile" onclick="go('practice')"><div class="emoji">🎧</div><h3>Thực hành nghe / đọc</h3><p>Clip nghe và bài đọc ngắn trợ giúp.</p></div>
  </div>
  <div class="sectionhead"><h2>Học tiếp</h2><div class="row"><button class="btn secondary" onclick="go('chat')">💬 Gia sư AI Live</button></div></div>
  <div class="card"><div class="row between"><div><strong>Ngày ${state.lastDay||1}/365</strong><div class="muted">${DB.lessons[state.lastDay-1]?.title||'Bài học Ngày '+state.lastDay}</div></div><button class="btn" onclick="go('lesson',{day:state.lastDay||1})">Mở bài</button></div></div>`;
}

function curriculum(){
  $('#app').innerHTML=`
  <div class="sectionhead"><div><h2>Giáo trình 365 ngày</h2><div class="muted">Chọn bất kỳ ngày nào để học</div></div><button class="btn secondary" onclick="go('home')">← Trang chủ</button></div>
  <div class="card"><div class="row"><label for="daypick"><b>Đi tới ngày học</b></label><input id="daypick" class="input" type="number" min="1" max="365" value="${activeDay}" style="width:110px"><button class="btn" onclick="let v=+$('#daypick').value;if(v>=1&&v<=365)go('lesson',{day:v})">Mở bài</button></div></div>
  <h3 style="margin-top:24px">Danh sách 365 buổi học</h3>
  <div class="lessonlist" id="lessonlist">${DB.lessons.map(l=>lessonRow(l)).join('')}</div>`;
}

function lessonRow(l){
  let done=state.completed.includes(l.day);
  return `<button class="lessonrow ${done?'done':''}" onclick="go('lesson',{day:${l.day}})"><span class="num">${done?'✓':l.day}</span><span class="desc"><strong>Ngày ${l.day}: ${esc(l.title)}</strong><small>Tuần ${l.week}</small></span><span class="tag ${done?'done':''}">${done?'Đã học':'Mở bài'}</span></button>`;
}

function lesson(){
  let l=DB.lessons[activeDay-1] || {day: activeDay, title: "Ngày "+activeDay, html: "<p>Bài học Ngày "+activeDay+"</p>"};
  state.lastDay=activeDay; save();
  let done=state.completed.includes(l.day);
  $('#app').innerHTML=`
  <div class="sectionhead"><div><div class="muted">Bài học Ngày ${l.day}</div><h2>${esc(l.title)}</h2></div><button class="btn secondary" onclick="go('curriculum')">← Chọn ngày</button></div>
  
  <div class="live-box">
    <div class="live-status"><span class="live-dot" id="liveDot"></span><span id="liveStatus">Gemini Live kết nối qua Backend Proxy</span></div>
    <button id="btnLive" class="btn" style="width:100%" onclick="toggleLive()">🎙️ Bắt đầu đàm thoại giọng nói Gemini Live</button>
  </div>

  <div class="bar">
    <button class="btn secondary" onclick="speak('${esc(l.title).replace(/'/g,"\\'")}')">🔊 Nghe tên bài</button>
    <button class="btn ${done?'ghost':''}" onclick="complete(${l.day})">${done?'✓ Đã hoàn thành':'Đánh dấu hoàn thành'}</button>
  </div>
  <div class="lessonbody">${l.html}</div>
  
  <div class="card" style="margin-top:18px">
    <h3>Luyện viết chữ Hán bằng tay / chuột</h3>
    <div class="row"><label for="writeChar"><b>Chữ cần luyện</b></label><input id="writeChar" class="input" value="好" maxlength="2" style="width:90px;font-size:22px"><button class="btn secondary" onclick="clearWriting()">Xóa nét viết</button></div>
    <canvas id="writeCanvas" width="520" height="520" style="display:block;width:min(100%,360px);height:auto;margin:14px auto 0;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none"></canvas>
  </div>
  
  <div class="row between" style="margin-top:18px">
    <button class="btn ghost" ${l.day===1?'disabled':''} onclick="go('lesson',{day:${Math.max(1,l.day-1)}})">← Bài trước</button>
    <button class="btn" onclick="go('lesson',{day:${Math.min(365,l.day+1)}})">Bài kế →</button>
  </div>`;
  setupWritingPad();
}

function setupWritingPad(){
  let c=$('#writeCanvas'),input=$('#writeChar'); if(!c||!input)return;
  let ctx=c.getContext('2d'),drawing=false;
  function base(){
    ctx.clearRect(0,0,c.width,c.height); ctx.strokeStyle='#d8e4dc'; ctx.lineWidth=2; ctx.setLineDash([8,8]);
    ctx.strokeRect(8,8,c.width-16,c.height-16); ctx.beginPath(); ctx.moveTo(c.width/2,8); ctx.lineTo(c.width/2,c.height-8);
    ctx.moveTo(8,c.height/2); ctx.lineTo(c.width-8,c.height/2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(23,107,87,.14)'; ctx.font='280px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(input.value||'字',c.width/2,c.height/2+8);
  }
  function point(e){ let r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height} }
  base(); input.addEventListener('input',base);
  c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);let p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle='#18332f';ctx.lineWidth=10;ctx.lineCap='round';ctx.lineJoin='round'});
  c.addEventListener('pointermove',e=>{if(!drawing)return;let p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
  ['pointerup','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>drawing=false)); c._base=base;
}
function clearWriting(){let c=$('#writeCanvas');if(c?._base)c._base()}
function complete(d){if(!state.completed.includes(d)){state.completed.push(d);state.completed.sort((a,b)=>a-b)}state.lastDay=d;save();render()}

function topics(){ $('#app').innerHTML=`<div class="sectionhead"><h2>Học nhanh theo chủ đề</h2><button class="btn secondary" onclick="go('home')">← Trang chủ</button></div><div class="topicgrid">${DB.topics.map(t=>`<button class="topic" onclick="go('curriculum')"><strong>${esc(t.title)}</strong><small>Tuần ${t.week}</small></button>`).join('')}</div>`; }
function topicdetail(){ go('curriculum'); }
function practice(){ $('#app').innerHTML=`<div class="sectionhead"><h2>Thực hành Nghe / Đọc</h2><button class="btn secondary" onclick="go('home')">← Trang chủ</button></div><div class="card"><p>Trải nghiệm các nguồn tài liệu học tiếng Hoa mở rộng.</p></div>`; }
function chat(){ $('#app').innerHTML=`<div class="sectionhead"><h2>Gia sư AI Gemini Live</h2><button class="btn secondary" onclick="go('home')">← Trang chủ</button></div><div class="live-box"><div class="live-status"><span class="live-dot" id="liveDot"></span><span id="liveStatus">Gemini Live qua WebSocket Proxy</span></div><button id="btnLive" class="btn" style="width:100%" onclick="toggleLive()">🎙️ Bắt đầu đàm thoại nói chuyện Live với Gemini</button></div>`; }
function exam(){ $('#app').innerHTML=`<div class="sectionhead"><h2>Bài kiểm tra</h2><button class="btn secondary" onclick="go('home')">← Trang chủ</button></div><div class="card"><p>Tính năng ôn tập kiểm tra 3 kỹ năng.</p></div>`; }

// ================= WebSocket Live Proxy Logic =================
async function toggleLive(){
  let btn = $('#btnLive'), status = $('#liveStatus'), dot = $('#liveDot');
  if(isLiveActive){ stopLive(); return; }
  try{
    status.textContent = "Đang kết nối Server Proxy Render...";
    geminiLiveWs = new WebSocket(RENDER_PROXY_WSS_URL);
    geminiLiveWs.onopen = async () => {
      status.textContent = "🔴 Gemini Live đang nghe... Hãy nói tiếng Trung!";
      if(dot) dot.classList.add('active');
      if(btn) { btn.textContent = "⏹ Dừng nói chuyện Live"; btn.className = "btn danger"; }
      isLiveActive = true;
      await startLiveMic();
    };
    geminiLiveWs.onmessage = (e) => {
      try {
        let msg = JSON.parse(e.data);
        if (msg.serverContent?.modelTurn?.parts) {
          for (let part of msg.serverContent.modelTurn.parts) {
            if (part.inlineData?.mimeType?.startsWith('audio/pcm')) playPCM(part.inlineData.data);
          }
        }
      } catch(err){}
    };
    geminiLiveWs.onclose = () => stopLive();
    geminiLiveWs.onerror = () => { status.textContent = "Lỗi kết nối Render Server!"; stopLive(); };
  }catch(e){ stopLive(); }
}

async function startLiveMic(){
  try{
    let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    liveAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    let source = liveAudioCtx.createMediaStreamSource(stream);
    liveScriptProc = liveAudioCtx.createScriptProcessor(4096, 1, 1);
    liveScriptProc.onaudioprocess = (e) => {
      if(!isLiveActive || !geminiLiveWs || geminiLiveWs.readyState !== WebSocket.OPEN) return;
      let input = e.inputBuffer.getChannelData(0);
      let buf = new ArrayBuffer(input.length * 2), view = new DataView(buf);
      for (let i = 0; i < input.length; i++) {
        let s = Math.max(-1, Math.min(1, input[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      let binary = '', bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      geminiLiveWs.send(JSON.stringify({ realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm", data: btoa(binary) }] } }));
    };
    source.connect(liveScriptProc);
    liveScriptProc.connect(liveAudioCtx.destination);
  }catch(e){}
}

function stopLive(){
  isLiveActive = false;
  if(geminiLiveWs) { try{ geminiLiveWs.close(); }catch(e){} geminiLiveWs = null; }
  if(liveScriptProc) { try{ liveScriptProc.disconnect(); }catch(e){} liveScriptProc = null; }
  if(liveAudioCtx) { try{ liveAudioCtx.close(); }catch(e){} liveAudioCtx = null; }
  let btn = $('#btnLive'), status = $('#liveStatus'), dot = $('#liveDot');
  if(btn) { btn.textContent = "🎙️ Bắt đầu đàm thoại giọng nói Gemini Live"; btn.className = "btn"; }
  if(status) status.textContent = "Đã ngắt kết nối Gemini Live.";
  if(dot) dot.classList.remove('active');
}

function playPCM(base64){
  try{
    let bin = atob(base64), bytes = new Uint8Array(bin.length), i16 = new Int16Array(bytes.buffer);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    let f32 = new Float32Array(i16.length);
    for(let i=0;i<i16.length;i++) f32[i] = i16[i] / 32768.0;
    let ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    let buf = ctx.createBuffer(1, f32.length, 24000);
    buf.getChannelData(0).set(f32);
    let src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
  }catch(e){}
}

function speak(t){
  if(!('speechSynthesis'in window)) return;
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);
  u.lang='zh-CN'; u.rate=.82;
